<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient (Vibrant Deep Fuchsia-Lilac to Dark Plum) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D0B40"/>
      <stop offset="45%" stop-color="#190724"/>
      <stop offset="100%" stop-color="#0E0316"/>
    </linearGradient>

    <radialGradient id="glowL" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowR" cx="75%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Pearl Front Frame -->
    <linearGradient id="rackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>

    <!-- Fuchsia Disc Gradient -->
    <radialGradient id="discFuchsia" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="25%" stop-color="#F472B6"/>
      <stop offset="65%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#701A75"/>
    </radialGradient>

    <!-- Amber Gold Disc Gradient -->
    <radialGradient id="discGold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>

    <radialGradient id="emptyHole" cx="45%" cy="40%" r="55%">
      <stop offset="65%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </radialGradient>

    <filter id="winGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#F0ABFC" flood-opacity="0.8"/>
    </filter>
    <filter id="rackShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <!-- Left Content Area -->
  <g transform="translate(100, 105)">
    <!-- Badge -->
    <rect x="0" y="0" width="186" height="38" rx="19" fill="#3B1261" stroke="#E879F9" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="93" y="24" fill="#F0ABFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">ONLINE WEB GAME</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Connect Four</text>
    <text x="0" y="165" fill="#E879F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">Forza Quattro</text>

    <!-- Subtitle -->
    <text x="0" y="235" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      <tspan x="0" dy="0">Play online with a friend using a room code, a random</tspan>
      <tspan x="0" dy="32">opponent, on the same device or against the computer.</tspan>
      <tspan x="0" dy="32">Customise disc colors, real-time chat &amp; no sign-up.</tspan>
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 355)">
      <rect x="0" y="0" width="125" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(232, 121, 249, 0.25)"/>
      <text x="62" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">1v1 Online</text>

      <rect x="137" y="0" width="130" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(232, 121, 249, 0.25)"/>
      <text x="202" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Computer AI</text>

      <rect x="279" y="0" width="145" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(232, 121, 249, 0.25)"/>
      <text x="351" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Same Device</text>

      <rect x="436" y="0" width="135" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(232, 121, 249, 0.25)"/>
      <text x="503" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Custom Discs</text>
    </g>

    <!-- Author link -->
    <text x="0" y="445" fill="#C084FC" font-family="sans-serif" font-size="16" font-weight="600">saveriomorelli.com/projects/connect-four/</text>
  </g>

  <!-- Right Side Visual: High-contrast 3D pearl Connect Four board -->
  <g transform="translate(735, 95)" filter="url(#rackShadow)">
    <rect x="0" y="20" width="375" height="400" rx="36" fill="url(#rackGrad)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Grid of cells (5 cols x 5 rows in illustration) -->
    <!-- Col centers: 55, 122, 188, 254, 320; Row centers: 75, 145, 215, 285, 355; Radius: 25 -->
    <!-- Row 0 -->
    <circle cx="55" cy="75" r="25" fill="url(#emptyHole)"/>
    <circle cx="122" cy="75" r="25" fill="url(#emptyHole)"/>
    <circle cx="188" cy="75" r="25" fill="url(#emptyHole)"/>
    <circle cx="254" cy="75" r="25" fill="url(#emptyHole)"/>
    <!-- Falling Gold Disc entering top slot -->
    <circle cx="320" cy="50" r="25" fill="url(#discGold)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Row 1 -->
    <circle cx="55" cy="145" r="25" fill="url(#emptyHole)"/>
    <circle cx="122" cy="145" r="25" fill="url(#emptyHole)"/>
    <circle cx="188" cy="145" r="25" fill="url(#emptyHole)"/>
    <!-- 4th winning Fuchsia disc -->
    <circle cx="254" cy="145" r="25" fill="url(#discFuchsia)"/>
    <circle cx="320" cy="145" r="25" fill="url(#discGold)"/>

    <!-- Row 2 -->
    <circle cx="55" cy="215" r="25" fill="url(#emptyHole)"/>
    <circle cx="122" cy="215" r="25" fill="url(#emptyHole)"/>
    <!-- 3rd winning Fuchsia disc -->
    <circle cx="188" cy="215" r="25" fill="url(#discFuchsia)"/>
    <circle cx="254" cy="215" r="25" fill="url(#discGold)"/>
    <circle cx="320" cy="215" r="25" fill="url(#discFuchsia)"/>

    <!-- Row 3 -->
    <circle cx="55" cy="285" r="25" fill="url(#emptyHole)"/>
    <!-- 2nd winning Fuchsia disc -->
    <circle cx="122" cy="285" r="25" fill="url(#discFuchsia)"/>
    <circle cx="188" cy="285" r="25" fill="url(#discGold)"/>
    <circle cx="254" cy="285" r="25" fill="url(#discFuchsia)"/>
    <circle cx="320" cy="285" r="25" fill="url(#discGold)"/>

    <!-- Row 4 (Bottom) -->
    <!-- 1st winning Fuchsia disc -->
    <circle cx="55" cy="355" r="25" fill="url(#discFuchsia)"/>
    <circle cx="122" cy="355" r="25" fill="url(#discGold)"/>
    <circle cx="188" cy="355" r="25" fill="url(#discGold)"/>
    <circle cx="254" cy="355" r="25" fill="url(#discFuchsia)"/>
    <circle cx="320" cy="355" r="25" fill="url(#discGold)"/>

    <!-- Winning line beam -->
    <line x1="55" y1="355" x2="254" y2="145" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.95" filter="url(#winGlow)"/>
    <circle cx="55" cy="355" r="6" fill="#FFFFFF"/>
    <circle cx="122" cy="285" r="6" fill="#FFFFFF"/>
    <circle cx="188" cy="215" r="6" fill="#FFFFFF"/>
    <circle cx="254" cy="145" r="6" fill="#FFFFFF"/>
  </g>
</svg>
