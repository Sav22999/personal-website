<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient (Rich Fuchsia to Deep Royal Lilac) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="35%" stop-color="#D946EF"/>
      <stop offset="70%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Clean Soft Drop Shadow -->
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#240438" flood-opacity="0.45"/>
    </filter>

    <!-- Fuchsia Disc (Player 1 Winning 4-in-a-row) -->
    <radialGradient id="discFuchsia" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F472B6"/>
      <stop offset="68%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#86198F"/>
    </radialGradient>

    <!-- Amber Gold Disc (Player 2) -->
    <radialGradient id="discGold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="68%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>

    <!-- Empty Socket Socket Background (Pastel Lilac) -->
    <radialGradient id="emptySocket" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#F1E6FD"/>
      <stop offset="80%" stop-color="#E2D0FA"/>
      <stop offset="100%" stop-color="#CAAAFB"/>
    </radialGradient>
  </defs>

  <!-- Background Squircle with Native Transparent Corners (rx="112") -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Centered White Board (320x320) matching Chess/Sudoku/FaceGuess style -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="#FFFFFF" filter="url(#boardShadow)"/>

  <!-- 4x4 Grid of Slots (Centers: 148, 220, 292, 364; Radius: 27) -->
  <!-- Row 0 (Top) -->
  <circle cx="148" cy="148" r="27" fill="url(#emptySocket)"/>
  <circle cx="220" cy="148" r="27" fill="url(#emptySocket)"/>
  <circle cx="292" cy="148" r="27" fill="url(#emptySocket)"/>
  <!-- Winner 4 -->
  <circle cx="364" cy="148" r="27" fill="url(#discFuchsia)"/>

  <!-- Row 1 -->
  <circle cx="148" cy="220" r="27" fill="url(#emptySocket)"/>
  <circle cx="220" cy="220" r="27" fill="url(#emptySocket)"/>
  <!-- Winner 3 -->
  <circle cx="292" cy="220" r="27" fill="url(#discFuchsia)"/>
  <circle cx="364" cy="220" r="27" fill="url(#discGold)"/>

  <!-- Row 2 -->
  <circle cx="148" cy="292" r="27" fill="url(#emptySocket)"/>
  <!-- Winner 2 -->
  <circle cx="220" cy="292" r="27" fill="url(#discFuchsia)"/>
  <circle cx="292" cy="292" r="27" fill="url(#discGold)"/>
  <circle cx="364" cy="292" r="27" fill="url(#discGold)"/>

  <!-- Row 3 (Bottom) -->
  <!-- Winner 1 -->
  <circle cx="148" cy="364" r="27" fill="url(#discFuchsia)"/>
  <circle cx="220" cy="364" r="27" fill="url(#discGold)"/>
  <circle cx="292" cy="364" r="27" fill="url(#discFuchsia)"/>
  <circle cx="364" cy="364" r="27" fill="url(#discGold)"/>
</svg>