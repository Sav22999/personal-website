<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (2-stop Linear: Fuchsia to Royal Lilac) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle (Flat Modern, rx="116") -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Centered White Board (320x320, rx="36", Pure Flat) -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="#FFFFFF"/>

  <!-- 12 Flat Empty Sockets (Soft Pastel Lilac) -->
  <circle cx="142" cy="142" r="30" fill="#E9D5FF"/>
  <circle cx="218" cy="142" r="30" fill="#E9D5FF"/>
  <circle cx="294" cy="142" r="30" fill="#E9D5FF"/>

  <circle cx="142" cy="218" r="30" fill="#E9D5FF"/>
  <circle cx="218" cy="218" r="30" fill="#E9D5FF"/>
  <circle cx="370" cy="218" r="30" fill="#E9D5FF"/>

  <circle cx="142" cy="294" r="30" fill="#E9D5FF"/>
  <circle cx="294" cy="294" r="30" fill="#E9D5FF"/>
  <circle cx="370" cy="294" r="30" fill="#E9D5FF"/>

  <circle cx="218" cy="370" r="30" fill="#E9D5FF"/>
  <circle cx="294" cy="370" r="30" fill="#E9D5FF"/>
  <circle cx="370" cy="370" r="30" fill="#E9D5FF"/>

  <!-- 4 Connected Winning Discs (Ascending Diagonal, Pure Flat Two-Tone) -->
  <circle cx="142" cy="370" r="30" fill="#D946EF"/>
  <circle cx="142" cy="370" r="18" fill="#C026D3"/>

  <circle cx="218" cy="294" r="30" fill="#D946EF"/>
  <circle cx="218" cy="294" r="18" fill="#C026D3"/>

  <circle cx="294" cy="218" r="30" fill="#D946EF"/>
  <circle cx="294" cy="218" r="18" fill="#C026D3"/>

  <circle cx="370" cy="142" r="30" fill="#D946EF"/>
  <circle cx="370" cy="142" r="18" fill="#C026D3"/>
</svg>
