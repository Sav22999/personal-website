<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <title>Giftwise</title>
    <meta content="Giftwise: wish lists for every occasion. Your friends see them and agree among themselves on who gives what, without spoiling the surprise."
          name="description">
    <meta content="noindex" name="robots">
    <meta content="#FBF6F7" media="(prefers-color-scheme: light)" name="theme-color">
    <meta content="#150F11" media="(prefers-color-scheme: dark)" name="theme-color">
    <meta content="light dark" name="color-scheme">
    <link href="manifest.webmanifest" rel="manifest">
    <link href="assets/icons/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="assets/icons/favicon-32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="assets/icons/apple-touch-icon.png" rel="apple-touch-icon">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="default" name="apple-mobile-web-app-status-bar-style">
    <link href="assets/app.css?v=1.2.2" rel="stylesheet">
    <link href="assets/giftwise.css?v=1.2.2" rel="stylesheet">
    <script>try {
        var t = JSON.parse(localStorage.getItem('gw.theme'));
        if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {
    }</script>
</head>
<body>
<div id="app">
    <div class="sk-view">
        <div class="sk-appbar">
            <div style="display:flex;flex-direction:column;gap:6px">
                <span class="skeleton" style="width:80px;height:14px;border-radius:4px"></span>
                <span class="skeleton" style="width:140px;height:24px;border-radius:6px"></span>
            </div>
            <span class="skeleton sk-avatar"></span>
        </div>
        <div class="sk-banner">
            <span class="skeleton sk-tile"></span>
            <div class="sk-body">
                <span class="skeleton sk-line w-80"></span>
                <span class="skeleton sk-line w-40"></span>
            </div>
        </div>
        <div class="sk-stack">
            <div class="sk-card">
                <span class="skeleton sk-tile"></span>
                <div class="sk-body"><span class="skeleton sk-title"></span><span class="skeleton sk-line w-60"></span>
                </div>
                <span class="skeleton sk-chip"></span>
            </div>
            <div class="sk-card">
                <span class="skeleton sk-tile"></span>
                <div class="sk-body"><span class="skeleton sk-title"></span><span class="skeleton sk-line w-60"></span>
                </div>
                <span class="skeleton sk-chip"></span>
            </div>
        </div>
    </div>
</div>
<noscript><p style="padding:24px">Giftwise needs JavaScript. / Giftwise ha bisogno di JavaScript.</p></noscript>
<script defer src="assets/i18n.js?v=1.2.2"></script>
<script defer src="assets/api.js?v=1.2.2"></script>
<script defer src="assets/ui.js?v=1.2.2"></script>
<script defer src="assets/app.js?v=1.2.2"></script>
</body>
</html>
