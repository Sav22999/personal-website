<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giftwise</title>
<meta name="description" content="Giftwise: wish lists for every occasion. Your friends see them and agree among themselves on who gives what, without spoiling the surprise.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150F11" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="assets/app.css?v=1.2.0">
<link rel="stylesheet" href="assets/giftwise.css?v=1.2.0">
<script>try{var t=JSON.parse(localStorage.getItem('gw.theme'));if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<div id="app">
  <div class="sk-view">
    <div class="sk-appbar">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="skeleton" style="width:80px;height:14px;border-radius:4px"></span>
        <span class="skeleton" style="width:140px;height:24px;border-radius:6px"></span>
      </div>
      <span class="skeleton sk-avatar"></span>
    </div>
    <div class="sk-banner">
      <span class="skeleton sk-tile"></span>
      <div class="sk-body">
        <span class="skeleton sk-line w-80"></span>
        <span class="skeleton sk-line w-40"></span>
      </div>
    </div>
    <div class="sk-stack">
      <div class="sk-card">
        <span class="skeleton sk-tile"></span>
        <div class="sk-body"><span class="skeleton sk-title"></span><span class="skeleton sk-line w-60"></span></div>
        <span class="skeleton sk-chip"></span>
      </div>
      <div class="sk-card">
        <span class="skeleton sk-tile"></span>
        <div class="sk-body"><span class="skeleton sk-title"></span><span class="skeleton sk-line w-60"></span></div>
        <span class="skeleton sk-chip"></span>
      </div>
    </div>
  </div>
</div>
<noscript><p style="padding:24px">Giftwise needs JavaScript. / Giftwise ha bisogno di JavaScript.</p></noscript>
<script src="assets/i18n.js?v=1.2.0" defer></script>
<script src="assets/api.js?v=1.2.0" defer></script>
<script src="assets/ui.js?v=1.2.0" defer></script>
<script src="assets/app.js?v=1.2.0" defer></script>
</body>
</html>
