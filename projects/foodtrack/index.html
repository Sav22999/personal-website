<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <title>FoodTrack</title>
    <meta content="FoodTrack: gestisci gli alimenti di casa, ricevi avvisi sulle scadenze, crea liste della spesa condivise e scopri ricette con ciò che hai già."
          name="description">
    <meta content="#F5F7F4" media="(prefers-color-scheme: light)" name="theme-color">
    <meta content="#0F120F" media="(prefers-color-scheme: dark)" name="theme-color">
    <meta content="light dark" name="color-scheme">
    <link href="manifest.webmanifest" rel="manifest">
    <link href="assets/icons/favicon-32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="assets/icons/icon-192.png" rel="icon" sizes="192x192" type="image/png">
    <link href="assets/icons/apple-touch-icon.png" rel="apple-touch-icon">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
    <meta content="FoodTrack" property="og:title">
    <meta content="Gestisci gli alimenti di casa, evita gli sprechi e scopri ricette con ciò che hai già."
          property="og:description">
    <meta content="https://www.saveriomorelli.com/images/projects/foodtrack.png" property="og:image">
    <link href="assets/app.css?v=1.6.9" rel="stylesheet">
    <script>try {
        var t = JSON.parse(localStorage.getItem('ft.theme'));
        if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {
    }</script>
</head>
<body>
<div id="app">
    <div class="sk-view">
        <div class="sk-appbar">
            <div style="display:flex;flex-direction:column;gap:6px">
                <span class="skeleton" style="width:80px;height:14px;border-radius:4px"></span>
                <span class="skeleton" style="width:140px;height:24px;border-radius:6px"></span>
            </div>
            <span class="skeleton sk-avatar"></span>
        </div>
        <div class="sk-banner">
            <span class="skeleton sk-tile"></span>
            <div class="sk-body">
                <span class="skeleton sk-line w-80"></span>
                <span class="skeleton sk-line w-40"></span>
            </div>
        </div>
        <div class="sk-stack">
            <div class="sk-card">
                <span class="skeleton sk-tile"></span>
                <div class="sk-body"><span class="skeleton sk-title"></span><span class="skeleton sk-line w-60"></span>
                </div>
                <span class="skeleton sk-chip"></span>
            </div>
            <div class="sk-card">
                <span class="skeleton sk-tile"></span>
                <div class="sk-body"><span class="skeleton sk-title"></span><span class="skeleton sk-line w-60"></span>
                </div>
                <span class="skeleton sk-chip"></span>
            </div>
            <div class="sk-card">
                <span class="skeleton sk-tile"></span>
                <div class="sk-body"><span class="skeleton sk-title"></span><span class="skeleton sk-line w-60"></span>
                </div>
                <span class="skeleton sk-chip"></span>
            </div>
        </div>
    </div>
</div>
<noscript><p style="padding:24px">FoodTrack needs JavaScript. / FoodTrack ha bisogno di JavaScript.</p></noscript>
<script defer src="assets/i18n.js?v=1.6.9"></script>
<script defer src="assets/img/icons.js?v=1.6.9"></script>
<script defer src="assets/api.js?v=1.6.9"></script>
<script defer src="assets/ui.js?v=1.6.9"></script>
<script defer src="assets/app.js?v=1.6.9"></script>
</body>
</html>
